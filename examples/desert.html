  <body>
    <a-scene physics light="defaultLightsEnabled: false" shadow="type: pcfsoft">
      <!-- <a-entity fps-counter></a-entity> -->

      <!-- Sky Setup -->
      <a-starry-sky web-worker-src="../dist/wasm/starry-sky-web-worker.js">
<!--         <sky-location>
          <sky-latitude>-40.9</sky-latitude>
          <sky-longitude>174.9</sky-longitude>
        </sky-location> -->
        <sky-location>
          <sky-latitude>69.6</sky-latitude>
          <sky-longitude>18.9</sky-longitude>
        </sky-location>
        <!-- Early afternoon at 60x, so there are about seven minutes of daylight to
             look at the clouds in before the sun sets. -->
        <sky-time >
          <sky-date>2018-06-15 18:00:00</sky-date>
          <sky-utc-offset>0</sky-utc-offset>
          <sky-speed>200</sky-speed>
        </sky-time>
        <sky-lighting>
          <sky-atmospheric-perspective-type>advanced</sky-atmospheric-perspective-type>
        </sky-lighting>
        <!-- The Milky Way is on by default, so this tag is only needed to tune
             it. Drop <sky-milky-way-enabled>false</sky-milky-way-enabled> in
             here to switch the band off entirely. -->
        <sky-milky-way>
          <sky-milky-way-intensity>0.7</sky-milky-way-intensity>
        </sky-milky-way>
        <!-- The aurora hangs overhead. <sky-aurora-activity> is the storm, as the Kp
             index: 0 a quiet arc, 5 a lively night, 9 a great storm with a pink
             fringe and red tops. -->
        <sky-aurora>
          <sky-aurora-activity>4</sky-aurora-activity>
        </sky-aurora>
        <!-- Clouds. The mere presence of <sky-clouds> enables them.
             <sky-cloud-type> picks the species, 0 to 1:
               0.0  stratus         - a thin, flat sheet low down
               0.25 stratocumulus   - broad lumpy patches
               0.5  cumulus         - fair weather puffs, about a kilometre across
               0.75 congestus       - taller, building towers
               1.0  cumulonimbus    - storm towers up to ~7.5km with an anvil
             The sky varies the species a little from place to place, so a 0.6 sky
             mixes cumulus with the odd building tower.

             Presets worth trying (swap the two values below):
               Fair weather:   coverage 35, type 0.5
               Building day:   coverage 40, type 0.65   (this one)
               Stormy:         coverage 20, type 1.0    (higher coverage closes into overcast)
               Grey deck:      coverage 70, type 0.2
               Stratus sheet:  coverage 60, type 0.0
             Clouds now run all the way to the horizon; <sky-cloud-cutoff-distance>
             (default 160000m) is where they fade out, not a wall. -->
<!--         <sky-clouds>
          <sky-cloud-coverage>40</sky-cloud-coverage>
          <sky-cloud-type>0.3</sky-cloud-type>
          <sky-cloud-velocity-x>40.0</sky-cloud-velocity-x>
          <sky-cloud-velocity-y>20.0</sky-cloud-velocity-y>
          <sky-mid-cloud-coverage>40</sky-mid-cloud-coverage>
          <sky-mid-cloud-type>0.2</sky-mid-cloud-type>
          <sky-mid-cloud-height>4000</sky-mid-cloud-height>
          <sky-cloud-resolution>4.0</sky-cloud-resolution>
        </sky-clouds> -->
      </a-starry-sky>

      <a-assets>
        <a-asset-item id="low-poly-desert" src="./assets/3d-models/low-poly-desert.glb" ></a-asset-item>
      </a-assets>

      <a-entity id="rig" movement-controls position="25 0.0 25">
        <a-entity camera look-controls wasd-controls="acceleration: 100"></a-entity>
      </a-entity>

      <!-- Scene Setup-->
      <a-entity gltf-model="#low-poly-desert" position="0 0" shadow="cast: false"></a-entity>

      <!-- Test Cube for Lighting -->
      <a-box color="white" position="0 2 -5" scale="0.5 0.5 0.5" shadow="cast: true; receive: true" animation="property: rotation; to: 0 360 0; dur: 10000; loop: true" animation__float="property: position; to: 0 2.5 -5; dur: 3000; dir: alternate; easing: easeInOutSine; loop: true"></a-box>
